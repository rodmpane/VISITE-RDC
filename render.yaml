# First online pilot: two free-tier resources. Upgrade to durable paid plans
# and configure backups before using the service as a public travel authority.
services:
  - type: web
    name: voyage-rdc-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voyage-rdc-postgres
          property: connectionString
      - key: ADMIN_API_TOKEN
        generateValue: true

databases:
  - name: voyage-rdc-postgres
    databaseName: voyage_rdc
    user: voyage_rdc
    region: frankfurt
    plan: free
